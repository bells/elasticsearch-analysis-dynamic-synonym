name: Publish plugin release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      es_version: ${{ steps.check.outputs.es_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          case "$version" in
            9.3.4|9.5.4) ;;
            *) echo "Unsupported release version: $version" >&2; exit 1 ;;
          esac
          echo "es_version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/verify.yml

  build-and-publish:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dynamic-synonym-plugin-${{ needs.version.outputs.es_version }}
          path: target/releases
      - name: Recheck release ZIP
        run: python3 scripts/verify-package.py --version ${{ needs.version.outputs.es_version }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish versioned image
        env:
          DOCKER_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
          RELEASE_TAG: ${{ github.ref_name }}
          ES_VERSION: ${{ needs.version.outputs.es_version }}
        run: |
          test -n "$DOCKER_NAMESPACE"
          make build_image_from_zip plugin_version="$ES_VERSION" image_host="$DOCKER_NAMESPACE/" image_tag="$RELEASE_TAG"
          make push_image image_host="$DOCKER_NAMESPACE/" image_tag="$RELEASE_TAG"
      - name: Publish plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive=(target/releases/*.zip)
          test -f "${archive[0]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${archive[0]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${archive[0]}" --verify-tag --generate-notes
          fi
