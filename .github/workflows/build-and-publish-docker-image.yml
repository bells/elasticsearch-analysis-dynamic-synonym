name: Build and push docker image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          version = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and POM versions differ'
          PY
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish versioned image
        env:
          DOCKER_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$DOCKER_NAMESPACE"
          make build_image_and_push image_host="$DOCKER_NAMESPACE/" image_tag="$RELEASE_TAG"
