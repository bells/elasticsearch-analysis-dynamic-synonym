name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode clean verify
      - run: python3 scripts/verify-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-synonym-plugin
          path: target/releases/*.zip
      - run: make build_image image_tag=ci
      - name: Verify installed plugin in Elasticsearch
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          mkdir -p "$RUNNER_TEMP/synonym-config"
          touch "$RUNNER_TEMP/synonym-config/synonym-smoke.txt"
          chmod 755 "$RUNNER_TEMP/synonym-config"
          chmod 644 "$RUNNER_TEMP/synonym-config/synonym-smoke.txt"
          trap 'docker logs synonym-smoke; docker rm -f synonym-smoke' EXIT
          docker run -d --name synonym-smoke -p 127.0.0.1:19200:9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e 'ES_JAVA_OPTS=-Xms512m -Xmx512m' \
            -v "$RUNNER_TEMP/synonym-config/synonym-smoke.txt:/usr/share/elasticsearch/config/synonym-smoke.txt:ro" \
            dynamic-synonym-elasticsearch:ci
          SYNONYM_FILE="$RUNNER_TEMP/synonym-config/synonym-smoke.txt" python3 scripts/smoke-test.py
